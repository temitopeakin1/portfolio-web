<section class="py-10 pr-6 pl-8 sm:pr-8 sm:pl-12 md:pl-16">
  <div class="hashnode-write mx-auto">
    <div class="flex flex-wrap items-center justify-between gap-4 mb-8">
      <a routerLink="/admin/blog" class="text-[15px] font-medium no-underline" style="color: var(--accent);">
        ← Back to posts
      </a>
      <button
        type="button"
        (click)="submit()"
        [disabled]="submitting()"
        class="inline-flex items-center justify-center min-h-[2.75rem] px-6 py-2.5 rounded-lg text-[15px] font-semibold border transition-opacity hover:opacity-90 disabled:opacity-50"
        style="background-color: var(--accent); color: var(--btn-primary-text); border-color: var(--accent);"
      >
        {{ submitting() ? 'Publishing…' : 'Publish' }}
      </button>
    </div>

    @if (loading()) {
      <p style="color: var(--text-muted);">Loading editor…</p>
    } @else {
      <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-8">
        <!-- Cover -->
        <div
          class="hashnode-cover"
          [class.hashnode-cover--filled]="coverImageValue()"
          (click)="onCoverClick(coverInput)"
          (keydown.enter)="onCoverClick(coverInput)"
          tabindex="0"
          role="button"
          aria-label="Add cover image"
        >
          @if (coverImageValue()) {
            <img [src]="coverImageValue()" alt="Cover preview" class="hashnode-cover__img" />
            <button type="button" class="hashnode-cover__remove" (click)="removeCover(); $event.stopPropagation()">
              Remove cover
            </button>
          } @else {
            <div class="hashnode-cover__empty">
              <span class="text-2xl" aria-hidden="true">🖼</span>
              <span class="font-semibold" style="color: var(--text);">Add a cover image</span>
              <span class="text-sm" style="color: var(--text-muted);">Click to upload or paste a URL below</span>
            </div>
          }
        </div>
        <input #coverInput type="file" accept="image/*" class="hidden" (change)="onCoverFileSelected($event)" />

        <div class="flex flex-col sm:flex-row gap-2">
          <input
            type="url"
            class="flex-1 px-4 py-2.5 rounded-lg border text-sm"
            style="background: var(--bg-card); border-color: var(--border); color: var(--text);"
            placeholder="Or paste cover image URL"
            [value]="coverUrlInput()"
            (input)="coverUrlInput.set($any($event.target).value)"
          />
          <button
            type="button"
            (click)="applyCoverUrl()"
            class="inline-flex items-center justify-center min-h-[2.5rem] px-4 py-2 rounded-lg text-sm font-medium border shrink-0"
            style="color: var(--accent); border-color: var(--border);"
          >
            Use URL
          </button>
        </div>

        <!-- Title & subheading -->
        <div class="space-y-3">
          <input
            formControlName="title"
            type="text"
            class="hashnode-title"
            placeholder="Article title"
            aria-label="Article title"
          />
          <input
            formControlName="subtitle"
            type="text"
            class="hashnode-subtitle"
            placeholder="Add a subheading…"
            aria-label="Subheading"
          />
        </div>

        <!-- Body with slash commands -->
        <app-markdown-editor formControlName="content" />

        <!-- Post settings -->
        <details class="hashnode-settings">
          <summary class="text-[15px] mb-4">Post settings</summary>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium mb-1" style="color: var(--text);">Slug</label>
              <input
                formControlName="slug"
                (input)="onSlugInput()"
                class="w-full px-4 py-2.5 rounded-lg border font-mono text-sm"
                style="background: var(--bg-card); border-color: var(--border); color: var(--text);"
              />
            </div>
            <div>
              <label class="block text-sm font-medium mb-1" style="color: var(--text);">Date</label>
              <input
                formControlName="date"
                class="w-full px-4 py-2.5 rounded-lg border text-sm"
                style="background: var(--bg-card); border-color: var(--border); color: var(--text);"
              />
            </div>
            <div class="sm:col-span-2">
              <label class="block text-sm font-medium mb-1" style="color: var(--text);">Card excerpt</label>
              <textarea
                formControlName="excerpt"
                rows="2"
                class="w-full px-4 py-2.5 rounded-lg border text-sm resize-y"
                style="background: var(--bg-card); border-color: var(--border); color: var(--text);"
                placeholder="Short summary for blog cards (auto-generated if empty)"
              ></textarea>
            </div>
            <div>
              <label class="block text-sm font-medium mb-1" style="color: var(--text);">Read time</label>
              <input
                formControlName="readTime"
                class="w-full px-4 py-2.5 rounded-lg border text-sm"
                style="background: var(--bg-card); border-color: var(--border); color: var(--text);"
              />
            </div>
          </div>
        </details>

        @if (error()) {
          <p class="text-sm" style="color: #c45c3e;">{{ error() }}</p>
        }
      </form>
    }
  </div>
</section>
