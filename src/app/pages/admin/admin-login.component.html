<section class="py-16 pr-8 pl-12 sm:pl-16 md:pl-20">
  <div class="max-w-md mx-auto rounded-xl p-8 border" style="background-color: var(--bg-card); border-color: var(--border);">
    <h1 class="text-3xl font-bold mb-2" style="color: var(--text);">Admin login</h1>
    <p class="mb-8 text-[15px]" style="color: var(--text-muted);">Sign in to publish blog posts.</p>
    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-5">
      <div>
        <label for="password" class="block text-sm font-medium mb-2" style="color: var(--text);">Password</label>
        <input id="password" type="password" formControlName="password" class="w-full px-4 py-3 rounded-lg border text-[15px]" style="background-color: var(--bg); border-color: var(--border); color: var(--text);" />
      </div>
      @if (error()) { <p class="text-sm" style="color: #c45c3e;">{{ error() }}</p> }
      <button type="submit" [disabled]="submitting() || form.invalid" class="w-full px-4 py-3 rounded-lg text-[15px] font-semibold disabled:opacity-50" style="background-color: var(--accent); color: var(--btn-primary-text);">{{ submitting() ? 'Signing in…' : 'Sign in' }}</button>
    </form>
    <a routerLink="/blog" class="inline-block mt-6 text-[15px] no-underline" style="color: var(--accent);">← Back to blog</a>
  </div>
</section>
